services:
  app:
    environment: &global-database
      APP_URL: http://localhost:${APP_PORT:-8082}
      DB_HOST: global-mysql
    networks: [backend, global-db]

  queue:
    environment: *global-database
    networks: [backend, global-db]

  scheduler:
    environment: *global-database
    networks: [backend, global-db]

  migrate:
    environment: *global-database
    networks: [backend, global-db]
    depends_on: !reset {}

  web:
    ports: !override
      - "${APP_PORT:-8082}:80"

networks:
  global-db:
    external: true
    name: global-db-network
